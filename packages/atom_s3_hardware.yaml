# ATOM S3 Hardware Configuration Package

# ESP32-S3 Configuration
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
  variant: esp32s3

# NO external library needed - using ESPHome native qr_code component!

# I2C for sensors (if needed)
i2c:
  sda: GPIO2
  scl: GPIO1
  scan: true

# SPI for display
spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

# LCD Backlight
output:
  - platform: ledc
    pin: GPIO16
    id: backlight_pwm
    frequency: 500Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "${friendly_name} Backlight"
    id: lcd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s


# QR Code component (native ESPHome)
qr_code:
  - id: wifi_qr
    value: "WIFI:T:WPA;S:MyNetwork;P:password;;"

# Display - ST7789V 128x128
display:
  - platform: st7789v
    model: Custom
    height: 128
    width: 128
    offset_height: 0
    offset_width: 0
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO34
    rotation: 0
    update_interval: 100ms
    id: atom_display
    lambda: |-
      if (id(current_state) == 0) {
        // ===== MAIN MENU =====
        it.printf(64, 10, id(font_medium), TextAlign::TOP_CENTER, "QRC Satellite");
        
        int count = id(saved_networks).size();
        if (count > 0) {
          // Show selected network
          std::string network_name = id(saved_networks)[id(network_index)];
          it.printf(64, 35, id(font_small), TextAlign::TOP_CENTER, "Network %d/%d:", id(network_index) + 1, count);
          it.printf(64, 50, id(font_medium), TextAlign::TOP_CENTER, "%s", network_name.c_str());
          
          it.printf(64, 75, id(font_small), TextAlign::TOP_CENTER, "Press: Next");
          it.printf(64, 92, id(font_small), TextAlign::TOP_CENTER, "Hold: Show QR");
        } else {
          it.printf(64, 50, id(font_small), TextAlign::TOP_CENTER, "No networks saved");
          it.printf(64, 70, id(font_small), TextAlign::TOP_CENTER, "Add via HA");
        }
      } 
      else if (id(current_state) == 1) {
        // ===== QR DISPLAY =====
        if (id(saved_networks).size() > id(network_index)) {
          std::string ssid = id(saved_networks)[id(network_index)];
          
          // Clear screen with white background for QR code
          it.filled_rectangle(0, 0, 128, 128, Color::WHITE);
          
          // Draw QR code centered (QR is ~25 modules * 4 scale = 100px)
          // Center: (128-100)/2 = 14 for x, and y=6 to leave room for footer
          it.qr_code(14, 6, id(wifi_qr), Color::BLACK, 4);
          
          // Footer with SSID name (at bottom)
          it.printf(64, 115, id(font_small), Color::BLACK, TextAlign::TOP_CENTER, "%s", ssid.c_str());
        }
      }



# Button - GPIO41
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      inverted: true
      mode:
        input: true
        pullup: true
    name: "${friendly_name} Button"
    id: main_button
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    
    # Short press - cycle networks
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("button", "Button pressed! State=%d", id(current_state));
            if (id(current_state) == 0) {
              // Menu - cycle networks
              if (id(saved_networks).size() > 0) {
                id(network_index) = (id(network_index) + 1) % id(saved_networks).size();
                ESP_LOGI("button", "Network %d selected", id(network_index));
              }
            } else {
              // QR display - return to menu
              id(current_state) = 0;
            }
    
    # Long press - show QR and update QR code value
    on_click:
      - min_length: 1000ms
        max_length: 5000ms
        then:
          - lambda: |-
              ESP_LOGI("button", "Long press - showing QR");
              if (id(saved_networks).size() > 0) {
                // Build WiFi QR string
                std::string ssid = id(saved_networks)[id(network_index)];
                std::string pwd = id(saved_passwords)[id(network_index)];
                std::string wifi_string = "WIFI:T:WPA;S:" + ssid + ";P:" + pwd + ";;";
                
                // Update QR code value
                id(wifi_qr).set_value(wifi_string);
                
                // Switch to QR display mode
                id(current_state) = 1;
              }


