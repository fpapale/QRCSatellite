# QRC Network Manager Package
# Manages WiFi networks and integrates with QRCService
# Note: API services are defined in main qrcsatellite.yaml

# Global variables
globals:
  - id: current_state
    type: int
    initial_value: '0'  # 0=menu, 1=qr_display
  - id: network_index
    type: int
    initial_value: '0'
  - id: saved_networks
    type: std::vector<std::string>
  - id: saved_passwords
    type: std::vector<std::string>


# Sensors
text_sensor:
  - platform: template
    name: "${friendly_name} Current Network"
    id: current_network_display
    update_interval: 1s
    lambda: |-
      if (id(saved_networks).size() > 0 && id(network_index) < id(saved_networks).size()) {
        return id(saved_networks)[id(network_index)];
      }
      return std::string("None");

sensor:
  - platform: template
    name: "${friendly_name} Network Count"
    id: network_count_sensor
    update_interval: 5s
    lambda: |-
      return id(saved_networks).size();
