# QRCSatellite - WiFi QR Display for ATOM S3

substitutions:
  device_name: qrcsatellite
  friendly_name: "QRC Satellite"
  # QRCService configuration
  ha_url: !secret ha_url2
  qr_image_path: "/local/qrcodes/atom_s3_qr.png"

esphome:
  name: ${device_name}
  comment: "QRCSatellite - WiFi QR Display Client"

# Include hardware-specific package
packages:
  atom_s3: !include packages/atom_s3_hardware.yaml
  network_manager: !include packages/qrc_network_manager.yaml  
  display_qr: !include packages/qrc_display.yaml

# Enable logging
logger:
  level: INFO

# Home Assistant API
api:
  encryption:
    key: !secret api_key2
  
  # Services from network manager
  services:
    # Add network
    - service: add_network
      variables:
        ssid: string
        password: string
      then:
        - lambda: |-
            ESP_LOGI("qrc", "Adding network: %s", ssid.c_str());
            id(saved_networks).push_back(ssid);
            id(saved_passwords).push_back(password);
    
    # Clear all networks
    - service: clear_networks
      then:
        - lambda: |-
            ESP_LOGI("qrc", "Clearing all networks");
            id(saved_networks).clear();
            id(saved_passwords).clear();
            id(network_index) = 0;
    
    # Request QR generation for current network
    - service: request_qr
      then:
        - lambda: |-
            if (id(saved_networks).size() > id(network_index)) {
              std::string ssid = id(saved_networks)[id(network_index)];
              std::string pwd = id(saved_passwords)[id(network_index)];
              ESP_LOGI("qrc", "Requesting QR for: %s", ssid.c_str());
            }
        - homeassistant.service:
            service: qrcservice.generate_wifi_qr
            data:
              ssid: !lambda 'return id(saved_networks)[id(network_index)];'
              password: !lambda 'return id(saved_passwords)[id(network_index)];'
              size: "128"
              filename: "atom_s3_qr.png"




# OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid2
  password: !secret wifi_password2
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password2

# Web server (optional - for debugging)
web_server:
  port: 80
  auth:
    username: !secret web_user2
    password: !secret web_pass2
